name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: { group: deploy-prod, cancel-in-progress: false }
permissions:
  contents: read
  packages: write
  deployments: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Previous successful production deployment
        id: prev
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=30" \
            --jq '.[].id' | while read id; do
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state')
              if [ "$state" = "success" ]; then
                gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha'; break
              fi; done)
          echo "sha=${prev}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Deployment
        id: dep
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" -f ref="$GITHUB_SHA" \
            -f environment=production -F auto_merge=false -F required_contexts[]= \
            -f description="sha_from=${{ steps.prev.outputs.sha }}" \
            -f payload="{\"sha_from\":\"${{ steps.prev.outputs.sha }}\",\"sha_to\":\"$GITHUB_SHA\"}" \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - name: Build and push images
        run: |
          for s in gateway orders payments; do
            docker build -f services/$s/Dockerfile -t $REGISTRY/shoplite-$s:$GITHUB_SHA .
            docker push $REGISTRY/shoplite-$s:$GITHUB_SHA
          done
      - name: Deploy to prod host
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          scp -i key -o StrictHostKeyChecking=accept-new docker-compose.prod.yml "ubuntu@$HOST:/opt/shoplite/docker-compose.yml"
          ssh -i key "ubuntu@$HOST" "cd /opt/shoplite && TAG=$GITHUB_SHA REGISTRY=$REGISTRY docker compose pull && TAG=$GITHUB_SHA REGISTRY=$REGISTRY docker compose up -d --remove-orphans"
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ vars.PUBLIC_DOMAIN }}/health" && exit 0; sleep 5
          done; exit 1
      - name: Record deployment status
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          state=$([ "${{ job.status }}" = "success" ] && echo success || echo failure)
          gh api "repos/$GITHUB_REPOSITORY/deployments/${{ steps.dep.outputs.id }}/statuses" \
            -f state=$state -f environment_url="https://${{ vars.PUBLIC_DOMAIN }}"
      - name: Announce deployment to CausalDeploy
        if: always() && vars.CAUSALDEPLOY_URL != ''
        run: |
          curl -fsS -X POST "${{ vars.CAUSALDEPLOY_URL }}/api/v1/events" \
            -H "x-api-key: ${{ secrets.CAUSALDEPLOY_API_KEY }}" -H 'content-type: application/json' \
            -d "[{\"type\":\"deployment\",\"repo\":\"$GITHUB_REPOSITORY\",\"id\":\"${{ steps.dep.outputs.id }}\",\"env\":\"production\",\"services\":[\"gateway\",\"orders\",\"payments\"],\"sha_from\":\"${{ steps.prev.outputs.sha }}\",\"sha_to\":\"$GITHUB_SHA\",\"started_at\":\"$(date -u +%FT%TZ)\",\"finished_at\":\"$(date -u +%FT%TZ)\",\"status\":\"${{ job.status == 'success' && 'success' || 'failure' }}\"}]" || true
